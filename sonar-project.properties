# Configuración para SonarQube Cloud (la usa el pipeline de GitHub Actions).
# Los archivos BACKEND/ y FRONTEND/sonar-project.properties siguen sirviendo
# para el SonarQube local de la Actividad 2.
sonar.organization=st3m4n
sonar.projectKey=St3m4n_atlas-calidad
sonar.projectName=Atlas

# SonarQube Cloud analiza todo el repositorio (sonar.sources y sonar.tests ya no
# tienen efecto); solo se excluyen dependencias y recursos estáticos.
sonar.exclusions=**/node_modules/**,FRONTEND/src/assets/**

# Cobertura de las pruebas del backend
sonar.javascript.lcov.reportPaths=BACKEND/coverage/lcov.info
# Fuera del cálculo de cobertura:
# - FRONTEND/src: se prueba con Playwright (no genera cobertura de código)
# - pruebas-e2e y pruebas-rendimiento: son los scripts de prueba, no código de Atlas
sonar.coverage.exclusions=FRONTEND/src/**,pruebas-e2e/**,pruebas-rendimiento/**

sonar.sourceEncoding=UTF-8
